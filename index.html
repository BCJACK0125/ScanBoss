<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 關鍵優化：強制視窗適配手機，禁止縮放，並設定為 Web App 模式 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>超市助手 V3</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #2E7D32;
            --accent-color: #FF9800;
            --bg-color: #f2f3f5;
            --white: #ffffff;
            --text-main: #2c3e50;
            --nav-height: 60px;
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* 全螢幕佈局策略：固定 Body 防止捲動，只讓 Main 捲動 */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; /* 禁止瀏覽器本身的橡皮筋效果 */
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: fixed; /* 鎖定視窗 */
        }

        /* 頂部標題 */
        header {
            position: absolute; top: 0; left: 0; right: 0;
            height: 50px;
            background-color: var(--primary-color);
            color: var(--white);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px;
            padding-top: env(safe-area-inset-top); /* 避開瀏海 */
            font-weight: bold; z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 內容滾動區 */
        main {
            position: absolute;
            top: calc(50px + env(safe-area-inset-top)); 
            bottom: calc(var(--nav-height) + var(--safe-area-bottom));
            left: 0; right: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* iOS 慣性滾動 */
            padding: 15px;
        }

        /* 底部導航 */
        nav {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: calc(var(--nav-height) + var(--safe-area-bottom));
            background: var(--white);
            border-top: 1px solid #ddd;
            display: flex; align-items: flex-start; /* 對齊上方 */
            justify-content: space-around;
            padding-top: 8px;
            z-index: 100;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #999; font-size: 10px; width: 20%; cursor: pointer;
        }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary-color); font-weight: bold; }

        /* 頁面切換 */
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 共用元件 */
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .btn { border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; width: 100%; text-align: center; margin-bottom: 10px; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-accent { background: var(--accent-color); color: white; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-outline { background: transparent; border: 1px solid #ccc; color: #555; }
        
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 12px; background: #fff; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }

        /* 掃描器樣式 (共用) */
        .scanner-container {
            width: 100%; height: 240px; background: #000;
            border-radius: 10px; overflow: hidden; margin-bottom: 15px; position: relative;
        }
        .html5-qrcode-element { height: 100% !important; object-fit: cover; }

        /* 進貨頁面專用樣式 */
        .restock-mode { background: #E8F5E9; border: 2px solid var(--primary-color); }
        .img-preview-box { width: 80px; height: 80px; background: #eee; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .img-preview-box img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<header>
    <div id="header-title">結帳櫃台</div>
    <div style="font-size:12px; opacity:0.8;">V3.0</div>
</header>

<main>
    <!-- === 1. 結帳頁面 === -->
    <section id="page-checkout" class="page active">
        <!-- 結帳專用掃描框 -->
        <div id="scanner-checkout" class="scanner-container"></div>

        <div class="card">
            <div style="display: flex; gap: 10px;">
                <input type="number" id="manual-code-checkout" placeholder="手動輸入條碼" style="margin:0; flex:1">
                <button class="btn btn-primary" style="width: auto; margin:0;" onclick="manualAddCheckout()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>

        <div class="card" style="min-height: 150px;">
            <div id="cart-list">
                <p style="text-align: center; color: #999; margin-top: 20px;">
                    <i class="fas fa-barcode" style="font-size: 30px;"></i><br>請掃描商品
                </p>
            </div>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 2px dashed #eee; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 18px; font-weight: bold;">總計</span>
                <span id="cart-total" style="font-size: 28px; font-weight: bold; color: var(--primary-color);">$0</span>
            </div>
        </div>

        <button class="btn btn-primary" onclick="checkout()">結帳 (Pay)</button>
    </section>

    <!-- === 2. 進貨頁面 (大幅優化) === -->
    <section id="page-inventory" class="page">
        <!-- 進貨專用掃描框 -->
        <div id="scanner-inventory" class="scanner-container"></div>

        <!-- 搜尋與狀態區 -->
        <div class="card">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="inv-search-code" placeholder="掃描或輸入條碼" style="margin:0; flex:1">
                <button class="btn btn-outline" style="width: auto; margin:0;" onclick="manualSearchInv()">查詢</button>
            </div>
        </div>

        <!-- 模式 A: 快速補貨 (舊商品) -->
        <div id="inv-restock-panel" class="card restock-mode" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: start;">
                <div>
                    <h3 id="rs-name" style="margin: 0 0 5px 0;">可口可樂</h3>
                    <div style="color: #666; font-size: 14px;">當前庫存: <b id="rs-current-stock" style="font-size:18px;">50</b></div>
                </div>
                <img id="rs-img" src="" style="width: 50px; height: 50px; border-radius: 5px; object-fit: cover; background: #ccc;">
            </div>
            
            <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
            
            <label>進貨數量 (+)</label>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" style="width: 50px; margin:0;" onclick="adjRestock(-1)">-</button>
                <input type="number" id="rs-qty-input" value="1" style="margin:0; text-align: center; font-size: 20px; font-weight: bold;">
                <button class="btn btn-outline" style="width: 50px; margin:0;" onclick="adjRestock(1)">+</button>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-outline" style="margin:0;" onclick="switchToEditMode()">編輯詳情</button>
                <button class="btn btn-primary" style="margin:0; flex: 2;" onclick="confirmRestock()">確認入庫</button>
            </div>
        </div>

        <!-- 模式 B: 商品建檔/編輯 (新商品或編輯詳情) -->
        <div id="inv-edit-panel" class="card" style="display: none;">
            <h3 id="edit-title">新商品建檔</h3>
            <input type="hidden" id="edit-barcode">

            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div class="img-preview-box" onclick="document.getElementById('img-upload').click()">
                    <img id="edit-img-preview" src="" style="display:none;">
                    <i id="edit-img-icon" class="fas fa-camera" style="color:#999; font-size: 24px;"></i>
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <span style="font-size: 14px; color: #666; margin-bottom: 5px;">點擊左側拍照</span>
                    <!-- 隱藏的 input -->
                    <input type="file" id="img-upload" accept="image/*" style="display:none" onchange="compressImage(this)">
                </div>
            </div>

            <label>商品名稱</label>
            <input type="text" id="edit-name">

            <div style="display: flex; gap: 10px;">
                <div style="flex:1"><label>售價</label><input type="number" id="edit-price"></div>
                <div style="flex:1"><label>成本</label><input type="number" id="edit-cost"></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div style="flex:1"><label>庫存量</label><input type="number" id="edit-stock"></div>
                <div style="flex:1"><label>警示值</label><input type="number" id="edit-threshold" value="5"></div>
            </div>

            <label>有效期限</label>
            <input type="date" id="edit-expiry">

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" onclick="cancelEdit()">取消</button>
                <button class="btn btn-primary" onclick="saveProduct()">儲存資料</button>
            </div>
            <button class="btn btn-danger" style="margin-top: 15px;" onclick="deleteProduct()">刪除此商品</button>
        </div>
    </section>

    <!-- === 3. 營收 (維持原樣) === -->
    <section id="page-stats" class="page">
        <div class="card">
            <h3>今日概況</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center;">
                <div><div style="color:#666">營業額</div><div id="stat-rev" style="font-size:24px; color:var(--primary-color); font-weight:bold;">$0</div></div>
                <div><div style="color:#666">毛利</div><div id="stat-profit" style="font-size:24px; color:var(--accent-color); font-weight:bold;">$0</div></div>
            </div>
        </div>
    </section>
    
    <!-- === 4. 設定 (維持原樣) === -->
    <section id="page-settings" class="page">
        <div class="card">
            <button class="btn btn-danger" onclick="clearData()">清空所有資料</button>
        </div>
    </section>

</main>

<nav>
    <div class="nav-item active" onclick="switchPage('page-checkout', '結帳櫃台')">
        <i class="fas fa-cash-register"></i><span>結帳</span>
    </div>
    <div class="nav-item" onclick="switchPage('page-inventory', '進貨管理')">
        <i class="fas fa-box-open"></i><span>進貨</span>
    </div>
    <div class="nav-item" onclick="switchPage('page-stats', '營收分析')">
        <i class="fas fa-chart-line"></i><span>報表</span>
    </div>
    <div class="nav-item" onclick="switchPage('page-settings', '設定')">
        <i class="fas fa-cog"></i><span>設定</span>
    </div>
</nav>

<script>
    // --- 1. 資料庫與變數 ---
    let DB_PRODUCTS = JSON.parse(localStorage.getItem('sma_v3_products')) || [];
    let DB_TRANSACTIONS = JSON.parse(localStorage.getItem('sma_v3_transactions')) || [];
    let currentCart = [];
    let html5QrCode = null; // 掃描器實例
    let currentScannerId = null; // 紀錄目前在哪個 div 掃描
    
    // 初始化
    if(DB_PRODUCTS.length === 0) saveDB(); // 確保存檔格式

    function saveDB() {
        localStorage.setItem('sma_v3_products', JSON.stringify(DB_PRODUCTS));
        localStorage.setItem('sma_v3_transactions', JSON.stringify(DB_TRANSACTIONS));
    }

    // --- 2. 頁面切換與相機控制 ---
    function switchPage(pageId, title) {
        // UI 切換
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('header-title').innerText = title;
        
        // Nav 狀態
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        const navMap = {'page-checkout':0, 'page-inventory':1, 'page-stats':2, 'page-settings':3};
        if(navMap[pageId] !== undefined) document.querySelectorAll('.nav-item')[navMap[pageId]].classList.add('active');

        // 核心：相機資源管理
        stopScanner().then(() => {
            if (pageId === 'page-checkout') {
                startScanner('scanner-checkout', handleCheckoutScan);
            } else if (pageId === 'page-inventory') {
                // 進貨頁面重置 UI
                document.getElementById('inv-restock-panel').style.display = 'none';
                document.getElementById('inv-edit-panel').style.display = 'none';
                document.getElementById('inv-search-code').value = '';
                startScanner('scanner-inventory', handleInventoryScan);
            } else if (pageId === 'page-stats') {
                updateStats();
            }
        });
    }

    // --- 3. 掃描器邏輯 (核心優化) ---
    function startScanner(elementId, callback) {
        currentScannerId = elementId;
        html5QrCode = new Html5Qrcode(elementId);
        const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.5 };
        
        // 使用後置鏡頭
        html5QrCode.start({ facingMode: "environment" }, config, (text) => {
            // 掃描成功的回調
            callback(text);
        }).catch(err => {
            console.log("相機啟動失敗 (可能是權限或 HTTPS 問題)", err);
            document.getElementById(elementId).innerHTML = '<p style="color:white;text-align:center;padding-top:100px;">相機無法啟動<br>請手動輸入</p>';
        });
    }

    function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            return html5QrCode.stop().then(() => {
                html5QrCode.clear();
                html5QrCode = null;
            }).catch(err => console.log(err));
        }
        return Promise.resolve();
    }

    // 音效
    function beep() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 1200;
        gain.gain.value = 0.1;
        osc.start();
        setTimeout(() => osc.stop(), 100);
    }

    // --- 4. 結帳功能 ---
    function handleCheckoutScan(code) {
        beep();
        // 暫停一下避免連掃
        html5QrCode.pause();
        setTimeout(() => html5QrCode.resume(), 1000);

        const product = DB_PRODUCTS.find(p => p.barcode === code);
        if (product) {
            addToCart(product);
        } else {
            alert('未找到商品，請先去進貨頁面建檔');
        }
    }

    function manualAddCheckout() {
        const code = document.getElementById('manual-code-checkout').value;
        if(code) handleCheckoutScan(code);
        document.getElementById('manual-code-checkout').value = '';
    }

    function addToCart(product) {
        const exist = currentCart.find(i => i.barcode === product.barcode);
        if(exist) {
            exist.qty++;
        } else {
            currentCart.push({...product, qty: 1});
        }
        renderCart();
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        list.innerHTML = '';
        let total = 0;
        currentCart.forEach((item, idx) => {
            total += item.price * item.qty;
            list.innerHTML += `
                <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee;">
                    <div><b>${item.name}</b><br><small>$${item.price} x ${item.qty}</small></div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <b>$${item.price * item.qty}</b>
                        <i class="fas fa-trash" style="color:#d32f2f" onclick="currentCart.splice(${idx},1);renderCart()"></i>
                    </div>
                </div>`;
        });
        if(currentCart.length === 0) list.innerHTML = '<p style="text-align: center; color: #999; margin-top: 20px;"><i class="fas fa-barcode"></i> 請掃描商品</p>';
        document.getElementById('cart-total').innerText = `$${total}`;
    }

    function checkout() {
        if(currentCart.length === 0) return;
        const total = currentCart.reduce((a,b)=>a+(b.price*b.qty),0);
        const cost = currentCart.reduce((a,b)=>a+(b.cost*b.qty),0);
        
        if(confirm(`總金額 $${total}，確認結帳？`)) {
            // 扣庫存
            currentCart.forEach(c => {
                const p = DB_PRODUCTS.find(db => db.barcode === c.barcode);
                if(p) {
                    p.stock -= c.qty;
                    p.sold = (p.sold || 0) + c.qty;
                }
            });
            // 記帳
            DB_TRANSACTIONS.push({
                time: new Date().toISOString(),
                total: total,
                profit: total - cost,
                items: [...currentCart]
            });
            saveDB();
            currentCart = [];
            renderCart();
            alert('結帳完成！');
        }
    }

    // --- 5. 進貨功能 (優化版：補貨 vs 編輯) ---
    function handleInventoryScan(code) {
        beep();
        html5QrCode.pause(); // 掃到後暫停相機，讓使用者操作
        
        document.getElementById('inv-search-code').value = code;
        const product = DB_PRODUCTS.find(p => p.barcode === code);

        if (product) {
            // 舊商品 -> 進入快速補貨模式
            showRestockUI(product);
        } else {
            // 新商品 -> 進入建檔模式
            if(confirm('這是新商品，要建檔嗎？')) {
                showEditUI(code, null);
            } else {
                html5QrCode.resume(); // 取消則恢復掃描
            }
        }
    }

    function manualSearchInv() {
        const code = document.getElementById('inv-search-code').value;
        if(!code) return;
        // 模擬掃描行為
        html5QrCode.pause();
        const product = DB_PRODUCTS.find(p => p.barcode === code);
        if(product) showRestockUI(product);
        else showEditUI(code, null);
    }

    // 顯示快速補貨 UI
    function showRestockUI(product) {
        document.getElementById('inv-restock-panel').style.display = 'block';
        document.getElementById('inv-edit-panel').style.display = 'none';
        
        // 填入資料
        document.getElementById('rs-name').innerText = product.name;
        document.getElementById('rs-current-stock').innerText = product.stock;
        document.getElementById('rs-qty-input').value = 1;
        document.getElementById('rs-img').src = product.img || '';
        document.getElementById('rs-img').style.display = product.img ? 'block' : 'none';
        
        // 暫存當前操作的 Barcode
        document.getElementById('inv-search-code').setAttribute('data-current', product.barcode);
    }

    function adjRestock(delta) {
        const input = document.getElementById('rs-qty-input');
        let val = parseInt(input.value) || 0;
        val += delta;
        if(val < 1) val = 1;
        input.value = val;
    }

    function confirmRestock() {
        const barcode = document.getElementById('inv-search-code').getAttribute('data-current');
        const qty = parseInt(document.getElementById('rs-qty-input').value);
        const product = DB_PRODUCTS.find(p => p.barcode === barcode);
        
        if(product) {
            product.stock += qty;
            saveDB();
            alert(`已入庫！目前庫存: ${product.stock}`);
            
            // 重置 UI 並恢復掃描
            document.getElementById('inv-restock-panel').style.display = 'none';
            document.getElementById('inv-search-code').value = '';
            html5QrCode.resume();
        }
    }

    function switchToEditMode() {
        const barcode = document.getElementById('inv-search-code').getAttribute('data-current');
        const product = DB_PRODUCTS.find(p => p.barcode === barcode);
        showEditUI(barcode, product);
    }

    // 顯示編輯/建檔 UI
    function showEditUI(barcode, product) {
        document.getElementById('inv-restock-panel').style.display = 'none';
        document.getElementById('inv-edit-panel').style.display = 'block';
        
        document.getElementById('edit-barcode').value = barcode;
        
        if(product) {
            document.getElementById('edit-title').innerText = "編輯商品詳情";
            document.getElementById('edit-name').value = product.name;
            document.getElementById('edit-price').value = product.price;
            document.getElementById('edit-cost').value = product.cost;
            document.getElementById('edit-stock').value = product.stock;
            document.getElementById('edit-threshold').value = product.threshold || 5;
            document.getElementById('edit-expiry').value = product.expiry || '';
            
            // 圖片
            if(product.img) {
                document.getElementById('edit-img-preview').src = product.img;
                document.getElementById('edit-img-preview').style.display = 'block';
                document.getElementById('edit-img-icon').style.display = 'none';
            } else {
                resetImgUI();
            }
        } else {
            document.getElementById('edit-title').innerText = "新商品建檔 (" + barcode + ")";
            // 清空表單
            document.getElementById('edit-name').value = '';
            document.getElementById('edit-price').value = '';
            document.getElementById('edit-cost').value = '';
            document.getElementById('edit-stock').value = '0';
            document.getElementById('edit-threshold').value = '5';
            document.getElementById('edit-expiry').value = '';
            resetImgUI();
        }
    }

    function resetImgUI() {
        document.getElementById('edit-img-preview').src = '';
        document.getElementById('edit-img-preview').style.display = 'none';
        document.getElementById('edit-img-icon').style.display = 'block';
    }

    function cancelEdit() {
        document.getElementById('inv-edit-panel').style.display = 'none';
        document.getElementById('inv-search-code').value = '';
        html5QrCode.resume();
    }

    function saveProduct() {
        const barcode = document.getElementById('edit-barcode').value;
        const name = document.getElementById('edit-name').value;
        if(!name) return alert('請輸入商品名稱');

        const newP = {
            barcode: barcode,
            name: name,
            price: Number(document.getElementById('edit-price').value),
            cost: Number(document.getElementById('edit-cost').value),
            stock: Number(document.getElementById('edit-stock').value),
            threshold: Number(document.getElementById('edit-threshold').value),
            expiry: document.getElementById('edit-expiry').value,
            img: document.getElementById('edit-img-preview').src, // 已是壓縮後的 Base64
            sold: 0
        };

        const idx = DB_PRODUCTS.findIndex(p => p.barcode === barcode);
        if(idx >= 0) {
            newP.sold = DB_PRODUCTS[idx].sold; // 保留銷量
            DB_PRODUCTS[idx] = newP;
        } else {
            DB_PRODUCTS.push(newP);
        }

        saveDB();
        alert('儲存成功');
        cancelEdit(); // 返回掃描狀態
    }

    function deleteProduct() {
        if(confirm('確定刪除此商品？')) {
            const barcode = document.getElementById('edit-barcode').value;
            DB_PRODUCTS = DB_PRODUCTS.filter(p => p.barcode !== barcode);
            saveDB();
            cancelEdit();
        }
    }

    // --- 6. 圖片壓縮邏輯 (關鍵優化) ---
    function compressImage(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                
                img.onload = function() {
                    // 創建 Canvas 進行壓縮
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 設定最大尺寸 (300px)
                    const MAX_SIZE = 300;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 轉出壓縮後的 JPEG Base64 (品質 0.7)
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    // 顯示預覽
                    document.getElementById('edit-img-preview').src = compressedDataUrl;
                    document.getElementById('edit-img-preview').style.display = 'block';
                    document.getElementById('edit-img-icon').style.display = 'none';
                }
            }
            reader.readAsDataURL(file);
        }
    }

    // --- 7. 營收與設定 ---
    function updateStats() {
        const today = new Date().toISOString().split('T')[0];
        const todayTx = DB_TRANSACTIONS.filter(t => t.time.startsWith(today));
        const rev = todayTx.reduce((a,b)=>a+b.total,0);
        const profit = todayTx.reduce((a,b)=>a+b.profit,0);
        
        document.getElementById('stat-rev').innerText = `$${rev}`;
        document.getElementById('stat-profit').innerText = `$${profit}`;
    }

    function clearData() {
        if(confirm('確定清空所有資料？')) {
            localStorage.clear();
            location.reload();
        }
    }

    // 啟動
    switchPage('page-checkout', '結帳櫃台');

</script>
